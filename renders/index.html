        zh: "在 71 套顶级品牌设计系统中搜索（例如 Vercel, Stripe, Claude...）",
        en: "Search in 71 premium brand design systems (e.g. Vercel, Stripe, Claude...)"
      };

      const allTemplatesLabel = {
        zh: "全部模版",
        en: "All Templates"
      };

      const previewBtnLabel = {
        zh: "预览渲染页",
        en: "Preview Render"
      };

      // State tracking
      let activeLanguage = 'zh';
      let activeCategory = 'all';
      let searchQuery = '';

      // Helper function to extract RGB from hex for shadow hover
      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
      }

      // Render category tabs dynamically
      const tabsContainer = document.getElementById('cat-tabs');
      function renderTabs() {
        const lang = activeLanguage;
        tabsContainer.innerHTML = `<div class="tab ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">${allTemplatesLabel[lang]} (${globalCount})</div>`;
        
        for (const cat in catalogData) {
          if (catalogData[cat].brands.length > 0) {
            const tab = document.createElement('div');
            tab.className = `tab ${activeCategory === cat ? 'active' : ''}`;
            tab.setAttribute('data-cat', cat);
            const catName = categoryNames[cat] ? categoryNames[cat][lang] : catalogData[cat].name;
            tab.textContent = `${catName} (${catalogData[cat].brands.length})`;
            tabsContainer.appendChild(tab);
          }
        }
      }

      // Render layout based on search, category and language filters
      const container = document.getElementById('brands-container');
      const searchInput = document.getElementById('brand-search');

      function render() {
        const lang = activeLanguage;
        container.innerHTML = '';
        let totalRendered = 0;

        for (const cat in catalogData) {
          if (activeCategory !== 'all' && activeCategory !== cat) continue;

          // Filter brands based on search
          const filteredBrands = catalogData[cat].brands.filter(b => {
            const nameToSearch = (b[`name_${lang}`] || b.name || '').toLowerCase();
            const slugToSearch = (b.slug || '').toLowerCase();
            
            // Search all keyword fields across both languages
            const keywordsArray = b[`keywords_${lang}`] || b.keywords || [];
            const keywordsToSearch = keywordsArray.some(k => k.toLowerCase().includes(searchQuery.toLowerCase()));
            
            return nameToSearch.includes(searchQuery.toLowerCase()) || 
                   slugToSearch.includes(searchQuery.toLowerCase()) || 
                   keywordsToSearch;
          });

          if (filteredBrands.length === 0) continue;

          totalRendered += filteredBrands.length;

          // Create category section
          const section = document.createElement('section');
          section.className = 'category-section';
          section.id = `section-${cat}`;

          const catName = categoryNames[cat] ? categoryNames[cat][lang] : catalogData[cat].name;
          const sectionTitle = document.createElement('div');
          sectionTitle.className = 'category-title';
          sectionTitle.innerHTML = `
            <span>${catName}</span>
            <span class="category-count">${filteredBrands.length}</span>
          `;
          section.appendChild(sectionTitle);

          const grid = document.createElement('div');
          grid.className = 'brand-grid';

          filteredBrands.forEach(b => {
            const card = document.createElement('a');
            card.className = 'brand-card';
            card.href = b.link;
            card.target = '_blank';
            card.style.setProperty('--accent-color', b.accent);
            card.style.setProperty('--accent-rgb', hexToRgb(b.accent));

            const name = b[`name_${lang}`] || b.name;
            const keywords = b[`keywords_${lang}`] || b.keywords || [];

            // Build keywords html
            const keywordsHtml = keywords.map(k => `<span class="keyword-badge">${k}</span>`).join('');

            card.innerHTML = `
              <div class="brand-header">
                <h3 class="brand-name">${name}</h3>
                <div class="brand-accent-dot"></div>
              </div>
              <div class="brand-keywords">
                ${keywordsHtml}
              </div>
              <div class="brand-footer">
                <span class="open-btn">
                  ${previewBtnLabel[lang]}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </span>
              </div>
            `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          container.appendChild(section);
        }

        // Show/hide empty state
        const emptyState = document.getElementById('empty-state');
        if (totalRendered === 0) {
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';
        }
      }

      // Language Switcher handler
      function setLanguage(lang) {
        activeLanguage = lang;
        localStorage.setItem('dig-ui-lang', lang);
        document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');

        // Toggle button states
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        // Translate headers and static nodes
        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.textContent = el.getAttribute(`data-${lang}`);
        });

        // Update search placeholder
        searchInput.placeholder = searchPlaceholder[lang];

        // Re-render tabs and brands
        renderTabs();
        render();
      }

      // Initialise listeners
      document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('dig-ui-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
        setLanguage(savedLang);

        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
          });
        });
      });

      // Set up tabs listeners
      tabsContainer.addEventListener('click', (e) => {
        const tab = e.target.closest('.tab');
        if (!tab) return;

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        activeCategory = tab.getAttribute('data-cat');
        render();
      });

      // Set up search listener
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        render();
      });
    </script>
  </body>
</html>
