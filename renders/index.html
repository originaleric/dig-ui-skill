<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dig UI Design System Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a13;
        --bg-soft: #0e1326;
        --panel: rgba(17, 22, 43, 0.72);
        --panel-hover: rgba(25, 32, 61, 0.85);
        --text: #f3f5f9;
        --muted: #8fa0b5;
        --accent: #37d67a;
        --accent-glow: rgba(55, 214, 122, 0.15);
        --border: rgba(143, 161, 185, 0.12);
        --border-hover: rgba(143, 161, 185, 0.24);
      }
      * {
        box-sizing: border-box;
        transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", sans-serif;
        background: 
          radial-gradient(circle at 10% 10%, rgba(55, 214, 122, 0.15), transparent 30rem),
          radial-gradient(circle at 90% 15%, rgba(79, 179, 255, 0.12), transparent 35rem),
          radial-gradient(circle at 50% 80%, rgba(204, 120, 92, 0.08), transparent 35rem),
          var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      .shell {
        width: min(1320px, calc(100% - 48px));
        margin: 0 auto;
        padding: 56px 0 80px;
      }
      header {
        text-align: center;
        margin-bottom: 48px;
      }
      .logo-area {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .logo-circle {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #37d67a, #2697eb);
        box-shadow: 0 8px 24px rgba(55, 214, 122, 0.3);
      }
      .logo-text {
        font-family: "Outfit", sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff, var(--muted));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-family: "Outfit", sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0 0 12px;
        background: linear-gradient(135deg, #ffffff, #8fa0b5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header p {
        color: var(--muted);
        font-size: 18px;
        max-width: 640px;
        margin: 0 auto 32px;
        line-height: 1.6;
      }

      .layout-hub-banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 auto 32px;
        max-width: 720px;
        padding: 18px 22px;
        border-radius: 18px;
        border: 1px solid rgba(79, 179, 255, 0.28);
        background: linear-gradient(135deg, rgba(79, 179, 255, 0.12), rgba(55, 214, 122, 0.08));
        text-align: left;
      }
      .layout-hub-banner strong {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
        color: var(--text);
      }
      .layout-hub-banner span {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .layout-hub-link {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 18px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .layout-hub-link:hover {
        border-color: rgba(79, 179, 255, 0.5);
        background: rgba(79, 179, 255, 0.12);
      }
      
      /* Search and Filter Area */
      .control-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 20px 24px;
        margin-bottom: 40px;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .search-box {
        position: relative;
        width: 100%;
      }
      .search-box input {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 20px 14px 48px;
        font-size: 16px;
        color: var(--text);
        outline: none;
      }
      .search-box input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-glow);
        background: rgba(0, 0, 0, 0.3);
      }
      .search-box svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }
      
      /* Category Navigation */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tab {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .tab:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-color: var(--border-hover);
      }
      .tab.active {
        background: var(--accent);
        color: #070a13;
        border-color: var(--accent);
        box-shadow: 0 8px 20px var(--accent-glow);
      }
      
      /* Dynamic Grid System */
      .category-section {
        margin-bottom: 56px;
      }
      .category-title {
        font-family: "Outfit", sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .category-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--border), transparent);
      }
      .category-count {
        font-size: 12px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 99px;
        border: 1px solid var(--border);
      }
      
      .brand-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      
      /* Premium Brand Cards */
      .brand-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 200px;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
      }
      .brand-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--accent-color, var(--accent));
        opacity: 0.8;
      }
      .brand-card:hover {
        background: var(--panel-hover);
        border-color: var(--border-hover);
        transform: translateY(-5px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 24px rgba(var(--accent-rgb), 0.08);
      }
      
      .brand-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .brand-name {
        font-family: "Outfit", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        margin: 0;
      }
      .brand-accent-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-color, var(--accent));
        box-shadow: 0 0 12px var(--accent-color, var(--accent));
      }
      
      .brand-keywords {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 20px 0;
      }
      .keyword-badge {
        font-size: 11px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 4px 8px;
        border-radius: 6px;
        text-transform: capitalize;
      }
      
      .brand-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }
      .open-btn {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-color, var(--accent));
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .brand-card:hover .open-btn {
        gap: 10px;
      }
      .brand-card:hover .open-btn svg {
        transform: translateX(4px);
      }
      
      .empty-state {
        text-align: center;
        padding: 80px 0;
        color: var(--muted);
        display: none;
      }
      
      /* Responsive */
      @media (max-width: 1200px) {
        .brand-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (max-width: 860px) {
        .brand-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        h1 { font-size: 40px; }
      }
      @media (max-width: 580px) {
        .brand-grid { grid-template-columns: 1fr; }
        .control-panel { padding: 16px; }
      }
      
      /* Floating Language Switcher Capsule */
      .lang-switch-capsule {
        position: fixed;
        top: 24px;
        right: 24px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(17, 22, 43, 0.85);
        border: 1px solid var(--border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 4px 8px;
        border-radius: 99px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        z-index: 9999;
      }
      .lang-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 99px;
        transition: all 0.2s ease;
        font-family: inherit;
      }
      .lang-btn.active {
        background: var(--accent);
        color: #070a13;
      }
      .lang-btn:hover:not(.active) {
        color: var(--text);
      }
      .lang-split {
        color: var(--border);
        font-size: 12px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- Floating Language Switcher Capsule -->
    <div class="lang-switch-capsule">
      <button class="lang-btn" data-lang="zh">中</button>
      <span class="lang-split">/</span>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <main class="shell">
      <header>
        <div class="logo-area">
          <div class="logo-circle"></div>
          <span class="logo-text">Dig UI Skill</span>
        </div>
        <h1 data-zh="设计系统可视化手册" data-en="Design System Handbook">设计系统可视化手册</h1>
        <p data-zh="这里汇集了全量导入的 71 套顶级品牌设计系统。每套风格都已严格编译为标准的 CSS Tokens，并提供高可用的交互式 HTML 渲染预览。" data-en="A curated collection of 71 premium design systems. Each system is compiled into standard CSS Tokens with live, highly interactive HTML preview pages.">这里汇集了全量导入的 71 套顶级品牌设计系统。每套风格都已严格编译为标准的 CSS Tokens，并提供高可用的交互式 HTML 渲染预览。</p>
      </header>

      <div class="layout-hub-banner">
        <div>
          <strong data-zh="Render Ops 维护入口" data-en="Render Ops Maintenance">Render Ops 维护入口</strong>
          <span data-zh="Catalog 看视觉语言，Layout 看页面骨架，Block 看状态矩阵。" data-en="Catalogs inspect visual language, layouts inspect skeletons, and blocks inspect state matrices.">Catalog 看视觉语言，Layout 看页面骨架，Block 看状态矩阵。</span>
        </div>
        <a class="layout-hub-link" href="./index.html" data-zh="Catalogs" data-en="Catalogs">Catalogs</a>
        <a class="layout-hub-link" href="./layouts/index.html" data-zh="Layouts" data-en="Layouts">Layouts</a>
        <a class="layout-hub-link" href="./blocks/index.html" data-zh="Blocks" data-en="Blocks">Blocks</a>
      </div>
      
      <div class="control-panel">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="brand-search" placeholder="在 71 套顶级品牌设计系统中搜索（例如 Vercel, Stripe, Claude...）" />
        </div>
        
        <div class="tabs" id="cat-tabs">
          <div class="tab active" data-cat="all">全部模版 (71)</div>
        </div>
      </div>
      
      <div id="brands-container">
        <!-- Dynamic categories and brands will be injected here -->
      </div>
      
      <div class="empty-state" id="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.6;"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        <div style="font-size: 18px; font-weight: 600;">未找到符合过滤条件的设计系统</div>
        <div style="font-size: 14px; margin-top: 6px;">请尝试输入其它搜索词，或切换不同的分类标签。</div>
      </div>
    </main>

ection, with copy compressed into a small editorial slot."], "link": "./media-consumer/playstation.html"}, {"slug": "uber", "name": "Uber Inspired", "name_zh": "Uber Inspired", "name_en": "Uber Inspired", "accent": "#000000", "bg": "#ffffff", "keywords_zh": ["An inspired interpretation of Uber's design language — a transportation-and-delivery super-app brand whose web surface is a black-and-white duet, framed by a custom geometric display sans, accented by a single signature pill shape (radius 999px) on every interactive element, and decorated only by editorial 4:3 illustrations of riders, drivers, and city objects."], "keywords_en": ["An inspired interpretation of Uber's design language — a transportation-and-delivery super-app brand whose web surface is a black-and-white duet, framed by a custom geometric display sans, accented by a single signature pill shape (radius 999px) on every interactive element, and decorated only by editorial 4:3 illustrations of riders, drivers, and city objects."], "link": "./media-consumer/uber.html"}, {"slug": "apple", "name": "Apple", "name_zh": "Apple", "name_en": "Apple", "accent": "#0071e3", "bg": "#f5f5f7", "keywords_zh": ["Standard Apple design system catalog featuring specialized components and typography schemas."], "keywords_en": ["Standard Apple design system catalog featuring specialized components and typography schemas."], "link": "./media-consumer/apple.html"}, {"slug": "wired", "name": "Wired Inspired", "name_zh": "Wired Inspired", "name_en": "Wired Inspired", "accent": "#000000", "bg": "#ffffff", "keywords_zh": ["An inspired interpretation of Wired's design language — a flagship technology-magazine brand whose surface is a strict editorial duet of stark black wordmark on white canvas, anchored by a tall narrow custom display serif for hero headlines, a humanist serif body face for long-form reading, and a clean sans face for metadata; layout reads like a printed magazine ported to the web with very little marketing ch       function getCatalogItems(cat) {
        const group = catalogData[cat] || {};
        return Array.isArray(group.items) ? group.items : (group.brands || []);
      }

      // Compute global total count
      let globalCount = 0;
      for (const cat in catalogData) {
        globalCount += getCatalogItems(cat).length;
      }
      
      // Helper function to extract RGB from hex for shadow hover
      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
      }
      
      // Bilingual constants
      const categoryNames = {
        "ai-llm": { zh: "AI & 大语言模型平台", en: "AI & LLM Platforms" },
        "dev-tools": { zh: "开发者工具与 IDE", en: "Developer Tools & IDEs" },

        "creative-tools": { zh: "设计与创意工具", en: "Design & Creative Tools" },
        "fintech": { zh: "金融科技与加密货币", en: "Fintech & Crypto" },
        "ecommerce": { zh: "电子商务与零售", en: "E-commerce & Retail" },

      };

      const searchPlaceholder = {
        zh: "在 71 套顶级品牌设计系统中搜索（例如 Vercel, Stripe, Claude...）",
        en: "Search in 71 premium brand design systems (e.g. Vercel, Stripe, Claude...)"

      const allTemplatesLabel = {
        zh: "全部模版",
        en: "All Templates"
      };

      const previewBtnLabel = {
        zh: "预览渲染页",
        en: "Preview Render"
      };

      // State tracking
      let activeLanguage = 'zh';
      let activeCategory = 'all';
      let searchQuery = '';

      // Helper function to extract RGB from hex for shadow hover
      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
      }

      // Render category tabs dynamically
      const tabsContainer = document.getElementById('cat-tabs');
      function renderTabs() {
        const lang = activeLanguage;
        tabsContainer.innerHTML = `<div class="tab ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">${allTemplatesLabel[lang]} (${globalCount})</div>`;
        
        for (const cat in catalogData) {
          const items = getCatalogItems(cat);
          if (items.length > 0) {
            const tab = document.createElement('div');
            tab.className = `tab ${activeCategory === cat ? 'active' : ''}`;
            tab.setAttribute('data-cat', cat);
            const catName = categoryNames[cat] ? categoryNames[cat][lang] : catalogData[cat].name;
            tab.textContent = `${catName} (${items.length})`;
            tabsContainer.appendChild(tab);
          }
        }
      }

      // Render layout based on search, category and language filters
      const container = document.getElementById('brands-container');
      const searchInput = document.getElementById('brand-search');

      function render() {
        const lang = activeLanguage;
        container.innerHTML = '';
        let totalRendered = 0;

        for (const cat in catalogData) {
          if (activeCategory !== 'all' && activeCategory !== cat) continue;

          // Filter brands based on search
          const filteredBrands = getCatalogItems(cat).filter(b => {
            const nameToSearch = (b[`name_${lang}`] || b.name || '').toLowerCase();
            const slugToSearch = (b.slug || '').toLowerCase();
            
            // Search all keyword fields across both languages
            const keywordsArray = b[`keywords_${lang}`] || b.keywords || [];
            const keywordsToSearch = keywordsArray.some(k => k.toLowerCase().includes(searchQuery.toLowerCase()));
            
            return nameToSearch.includes(searchQuery.toLowerCase()) || 
                   slugToSearch.includes(searchQuery.toLowerCase()) || 
                   keywordsToSearch;
          });

          if (filteredBrands.length === 0) continue;

          totalRendered += filteredBrands.length;

          // Create category section
          const section = document.createElement('section');
          section.className = 'category-section';
          section.id = `section-${cat}`;

          const catName = categoryNames[cat] ? categoryNames[cat][lang] : catalogData[cat].name;
          const sectionTitle = document.createElement('div');
          sectionTitle.className = 'category-title';
          sectionTitle.innerHTML = `
            <span>${catName}</span>
            <span class="category-count">${filteredBrands.length}</span>
          `;
          section.appendChild(sectionTitle);

          const grid = document.createElement('div');
          grid.className = 'brand-grid';

          filteredBrands.forEach(b => {
            const card = document.createElement('a');
            card.className = 'brand-card';
            card.href = b.link;
            card.target = '_blank';
            card.style.setProperty('--accent-color', b.accent);
            card.style.setProperty('--accent-rgb', hexToRgb(b.accent));

            const name = b[`name_${lang}`] || b.name;
            const keywords = b[`keywords_${lang}`] || b.keywords || [];

            // Build keywords html
            const keywordsHtml = keywords.map(k => `<span class="keyword-badge">${k}</span>`).join('');

            card.innerHTML = `
              <div class="brand-header">
                <h3 class="brand-name">${name}</h3>
                <div class="brand-accent-dot"></div>
              </div>
              <div class="brand-keywords">
                ${keywordsHtml}
              </div>
              <div class="brand-footer">
                <span class="open-btn">
                  ${previewBtnLabel[lang]}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </span>
              </div>
            `;
            grid.appendChild(card);
          });

          section.appendChild(grid);
          container.appendChild(section);
        }

        // Show/hide empty state
        const emptyState = document.getElementById('empty-state');
        if (totalRendered === 0) {
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';
        }
      }

      // Language Switcher handler
      function setLanguage(lang) {
        activeLanguage = lang;
        localStorage.setItem('dig-ui-lang', lang);
        document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');

        // Toggle button states
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        // Translate headers and static nodes
        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          el.textContent = el.getAttribute(`data-${lang}`);
        });

        // Update search placeholder
        searchInput.placeholder = searchPlaceholder[lang];

        // Re-render tabs and brands
        renderTabs();
        render();
      }

      // Initialise listeners
      document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('dig-ui-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
        setLanguage(savedLang);

        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
          });
        });
      });

      // Set up tabs listeners
      tabsContainer.addEventListener('click', (e) => {
        const tab = e.target.closest('.tab');
        if (!tab) return;

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        activeCategory = tab.getAttribute('data-cat');
        render();
      });

      // Set up search listener
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        render();
      });
    </script>
