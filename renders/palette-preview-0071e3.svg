      <text class="label" x="16" y="24" fill="#292524">canvas</text><text class="value" x="210" y="24" fill="#292524">#faf9f5</text>
      <rect x="294" y="14" width="28" height="28" rx="7" fill="#faf9f5" stroke="#d8d0c8"/>
      <rect x="0" y="68" width="340" height="58" rx="10" fill="#ffffff"/>
      <text class="label" x="16" y="92" fill="#292524">surface</text><text class="value" x="210" y="92" fill="#292524">#ffffff</text>
      <rect x="294" y="82" width="28" height="28" rx="7" fill="#ffffff" stroke="#d8d0c8"/>
      <rect x="0" y="136" width="340" height="58" rx="10" fill="#292524"/>
      <text class="label" x="16" y="160" fill="#ffffff">ink</text><text class="value" x="210" y="160" fill="#ffffff">#292524</text>
      <rect x="294" y="150" width="28" height="28" rx="7" fill="#292524"/>
      <rect x="0" y="204" width="340" height="58" rx="10" fill="#0071e3"/>
      <text class="label" x="16" y="228" fill="#ffffff">primary</text><text class="value" x="210" y="228" fill="#ffffff">#0071e3</text>
      <rect x="294" y="218" width="28" height="28" rx="7" fill="#0071e3"/>
      <rect x="0" y="272" width="340" height="58" rx="10" fill="#cc785c"/>
      <text class="label" x="16" y="296" fill="#ffffff">support</text><text class="value" x="210" y="296" fill="#ffffff">#cc785c</text>
