<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">Dig UI palette preview for primary blue #0071e3</title>
  <desc id="desc">Three role-based palette directions using #0071e3 as the primary Dig UI accent.</desc>
  <defs>
    <style>
      .page { fill: #f4f5f7; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101418; letter-spacing: 0; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6874; letter-spacing: 0; }
      .card-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .card-copy { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .value { font: 500 12px "SFMono-Regular", Consolas, monospace; letter-spacing: 0; }
      .pill-text { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="page" width="1320" height="860"/>
  <text class="title" x="56" y="68">#0071e3 palette directions</text>
  <text class="subtitle" x="56" y="98">Primary is fixed as Dig UI action blue. Each palette maps color to canvas, ink, surface, support, border, and control roles.</text>

  <!-- Palette 01 -->
  <g transform="translate(56 142)">
    <rect x="0" y="0" width="384" height="620" rx="18" fill="#ffffff"/>
    <rect x="18" y="18" width="348" height="248" rx="14" fill="#f7f7f7" stroke="rgba(0,0,0,0.56)"/>
    <text class="card-title" x="42" y="62" fill="#000000">System Blue</text>
    <text class="card-copy" x="42" y="90" fill="#4b5563">Clean product workspace, dashboard, SaaS.</text>
    <rect x="42" y="122" width="128" height="44" rx="22" fill="#0071e3"/>
    <text class="pill-text" x="72" y="150" fill="#ffffff">Primary</text>
    <rect x="182" y="122" width="128" height="44" rx="22" fill="#ffffff" stroke="#0071e3"/>
    <text class="pill-text" x="212" y="150" fill="#0071e3">Secondary</text>
    <rect x="42" y="192" width="132" height="48" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.56)"/>
    <text class="small" x="58" y="221" fill="#4b5563">Surface card</text>
    <rect x="190" y="192" width="120" height="48" rx="10" fill="rgb(250,250,252)" stroke="rgba(0,0,0,0.18)"/>
    <text class="small" x="210" y="221" fill="#4b5563">Control</text>
    <g transform="translate(22 302)">
      <rect x="0" y="0" width="340" height="58" rx="10" fill="#f7f7f7"/>
      <text class="label" x="16" y="24" fill="#4b5563">canvas</text><text class="value" x="210" y="24" fill="#000000">#f7f7f7</text>
      <rect x="294" y="14" width="28" height="28" rx="7" fill="#f7f7f7" stroke="rgba(0,0,0,0.56)"/>
      <rect x="0" y="68" width="340" height="58" rx="10" fill="#ffffff"/>
      <text class="label" x="16" y="92" fill="#4b5563">surface</text><text class="value" x="210" y="92" fill="#000000">#ffffff</text>
      <rect x="294" y="82" width="28" height="28" rx="7" fill="#ffffff" stroke="rgba(0,0,0,0.18)"/>
      <rect x="0" y="136" width="340" height="58" rx="10" fill="#000000"/>
      <text class="label" x="16" y="160" fill="#ffffff">ink</text><text class="value" x="210" y="160" fill="#ffffff">#000000</text>
      <rect x="294" y="150" width="28" height="28" rx="7" fill="#000000" stroke="#000000"/>
      <rect x="0" y="204" width="340" height="58" rx="10" fill="#0071e3"/>
      <text class="label" x="16" y="228" fill="#ffffff">primary</text><text class="value" x="210" y="228" fill="#ffffff">#0071e3</text>
      <rect x="294" y="218" width="28" height="28" rx="7" fill="#0071e3"/>
      <rect x="0" y="272" width="340" height="58" rx="10" fill="#4fb3ff"/>
      <text class="label" x="16" y="296" fill="#082235">support</text><text class="value" x="210" y="296" fill="#082235">#4fb3ff</text>
      <rect x="294" y="286" width="28" height="28" rx="7" fill="#4fb3ff"/>
