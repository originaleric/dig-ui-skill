      <text class="label" x="16" y="24" fill="#f7f8fb">canvas</text><text class="value" x="210" y="24" fill="#f7f8fb">#05070a</text>
      <rect x="294" y="14" width="28" height="28" rx="7" fill="#05070a" stroke="#273142"/>
      <rect x="0" y="68" width="340" height="58" rx="10" fill="#111418"/>
      <text class="label" x="16" y="92" fill="#f7f8fb">surface</text><text class="value" x="210" y="92" fill="#f7f8fb">#111418</text>
      <rect x="294" y="82" width="28" height="28" rx="7" fill="#111418" stroke="#273142"/>
      <rect x="0" y="136" width="340" height="58" rx="10" fill="#f7f8fb"/>
      <text class="label" x="16" y="160" fill="#05070a">ink</text><text class="value" x="210" y="160" fill="#05070a">#f7f8fb</text>
      <rect x="294" y="150" width="28" height="28" rx="7" fill="#f7f8fb" stroke="#cfd6df"/>
      <rect x="0" y="204" width="340" height="58" rx="10" fill="#0071e3"/>
      <text class="label" x="16" y="228" fill="#ffffff">primary</text><text class="value" x="210" y="228" fill="#ffffff">#0071e3</text>
      <rect x="294" y="218" width="28" height="28" rx="7" fill="#0071e3"/>
      <rect x="0" y="272" width="340" height="58" rx="10" fill="#2dd4ff"/>
      <text class="label" x="16" y="296" fill="#06202a">support</text><text class="value" x="210" y="296" fill="#06202a">#2dd4ff</text>
      <rect x="294" y="286" width="28" height="28" rx="7" fill="#2dd4ff"/>
    </g>
  </g>

