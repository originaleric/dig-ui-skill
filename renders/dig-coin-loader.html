<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dig 3D Logo Loader</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #07110a;
        font-family: "Archivo", "Noto Sans SC", sans-serif;
      }

      .stage {
        width: min(360px, 100vw);
        height: min(320px, 100vh);
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        width: 240px;
        height: 220px;
      }

      .fallback {
        position: fixed;
        inset: auto 16px 16px;
        max-width: 34rem;
        margin: 0;
        color: #6b736b;
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Dig 正在加载">
      <canvas id="dig-3d-loader" width="480" height="440"></canvas>
    </main>
    <p class="fallback" data-loader-status></p>

    <script src="../assets/dig-3d-loader.bundle.js?v=18"></script>
  
    <script>
      // Dynamic Token Visualizer
      document.addEventListener('DOMContentLoaded', () => {
        const rootStyles = getComputedStyle(document.documentElement);
        document.querySelectorAll('.token-val').forEach(el => {
          const tokenName = el.getAttribute('data-token');
          if (tokenName) {
            let value = rootStyles.getPropertyValue(tokenName).trim();
            if (value) {
              // Uppercase hex values for consistency
              if (value.startsWith('#')) {
                value = value.toUpperCase();
              }
              el.textContent = value;
            }
          }
        });
      });
    </script>
  </body>

</html>
